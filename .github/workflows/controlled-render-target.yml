name: Controlled Render Target Android Build

on:
  push:
    paths:
      - 'EXPERIMENTS/CONTROLLED-RENDER-TARGET/**'
      - 'BRIDGE-IMPL/**'
      - '.github/workflows/controlled-render-target.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264 cmake;3.22.1'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: EXPERIMENTS/CONTROLLED-RENDER-TARGET
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK and native libraries
        working-directory: EXPERIMENTS/CONTROLLED-RENDER-TARGET
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libpvr_minecraft_bridge.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libcontrolled_renderer.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: controlled-render-target-arm64-debug
          path: EXPERIMENTS/CONTROLLED-RENDER-TARGET/app/build/outputs/apk/debug/app-debug.apk
